name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Episode 1 tools
        run: python -m unittest discover -s ep01-silent-failure-checklist/tests -v
      - name: Episode 2 doc_guard
        run: python -m unittest discover -s ep02-agent-rules-templates/tests -v
      - name: Demos still find their planted bugs
        shell: bash
        run: |
          cd ep01-silent-failure-checklist
          python refcheck.py demo/refcheck/spec.json && exit 1 || test $? -eq 1
          python action_coverage.py --actions demo/coverage/actions.csv demo/coverage/events.jsonl && exit 1 || test $? -eq 1
          cd ../ep02-agent-rules-templates
          python doc_guard.py lint DESIGN-DOC-template.md zh/设计文档-模板.md example/docs
